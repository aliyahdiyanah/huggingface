<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse – Chatbot yang Faham Perasaan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0b0f19;
    --card-bg: #131b2e;
    --card-border: #1e293b;
    --accent-gold: #f59e0b;
    --accent-blue: #38bdf8;
  }
  html, body { height: 100%; }
  body {
    background-color: var(--bg-dark);
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  .header {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .brand { font-weight: 700; color: var(--accent-gold); font-size: 18px; }
  .status { font-size: 12px; color: #94a3b8; }
  .mood-track { height: 8px; border-radius: 6px; background: #ef4444; overflow: hidden; margin-top: 8px; }
  .mood-fill { height: 100%; width: 50%; background: #22c55e; transition: width 0.5s; }
  .mood-label { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; margin-top: 4px; }

  .chat {
    flex: 1;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 80%; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 15px;
    word-break: break-word;
  }
  .user .bubble {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: #0b0f19;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .bot .bubble {
    background: #1e293b;
    color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .tag { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .typing .bubble { color: #94a3b8; letter-spacing: 3px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 8px; }
  .chip {
    background: #070a12;
    border: 1px solid var(--card-border);
    color: var(--accent-blue);
    cursor: pointer;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

  .input-row { display: flex; gap: 8px; }
  .form-control, .form-control:focus {
    background-color: #070a12;
    border-color: var(--card-border);
    color: #fff;
    border-radius: 10px;
    padding: 12px;
  }
  .form-control:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 0.2rem rgba(245,158,11,.2); }
  .btn-gold {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: #0b0f19; font-weight: 700; border: none; border-radius: 10px; padding: 0 22px;
  }
  .btn-gold:disabled { opacity: .5; color: #0b0f19; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="d-flex justify-content-between align-items-center">
      <span class="brand">💬 Pulse</span>
      <span class="status" id="status">Memuatkan model AI...</span>
    </div>
    <div class="mood-track"><div class="mood-fill" id="moodFill"></div></div>
    <div class="mood-label"><span>😡 Negatif</span><span>Mood perbualan</span><span>Positif 😄</span></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="chips">
    <span class="chip" data-t="Hai Pulse!">👋 Hai Pulse!</span>
    <span class="chip" data-t="Hari ni saya penat sangat dan stress">😩 Penat & stress</span>
    <span class="chip" data-t="I got promoted today! I am so happy!">🎉 Dapat naik pangkat</span>
    <span class="chip" data-t="Boss saya marah saya depan semua orang">😡 Kena marah</span>
    <span class="chip" data-t="Terima kasih sebab dengar">🙏 Terima kasih</span>
  </div>

  <div class="input-row">
    <input type="text" id="msgInput" class="form-control" placeholder="Tulis sesuatu pada Pulse..." autocomplete="off" disabled />
    <button id="sendBtn" class="btn btn-gold" disabled>Hantar</button>
  </div>
</div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2";

const chat = document.getElementById("chat");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const moodFill = document.getElementById("moodFill");

let classifier = null;
let busy = false;
let moodScores = [];

/* ---------- Reply bank ---------- */
const R = {
  greeting: [
    "Hai! 😊 Apa cerita hari ni?",
    "Hello! Saya Pulse. Ceritalah apa yang ada dalam kepala awak.",
    "Hey, lama tunggu awak! Macam mana hari ni?"
  ],
  how: [
    "Saya okay je, sebab dapat berbual dengan awak! Awak pula macam mana?",
    "Alhamdulillah sihat. Awak? Ada apa-apa nak kongsi?"
  ],
  name: [
    "Saya Pulse, chatbot yang cuba faham perasaan awak. Saya baca nada mesej awak, lepas tu balas ikut mood. 😄"
  ],
  thanks: [
    "Sama-sama! Saya sentiasa ada kalau awak nak bercerita. 💛",
    "Small thing! Jaga diri tau."
  ],
  bye: [
    "Bye! Jumpa lagi. Jaga diri tau. 👋",
    "Okay, take care! Datang lagi bila-bila masa."
  ],
  veryPos: [
    "Wah, best gila! 🎉 Ceritalah lagi, saya nak dengar.",
    "Seronoknya dengar tu! 😄 Apa yang buat awak gembira sangat?",
    "Mantap! Awak memang layak dapat benda baik tu. 🙌"
  ],
  pos: [
    "Bagus la kalau macam tu! 😊",
    "Nice! Nampak awak dalam mood yang okay hari ni.",
    "Baguslah. Ada apa-apa lagi yang nak diceritakan?"
  ],
  neutral: [
    "Hmm, menarik. Ceritalah lagi sikit. 🤔",
    "Oh ye ke? Lepas tu apa jadi?",
    "Saya dengar ni. Teruskan."
  ],
  neg: [
    "Hmm, nampak macam tak berapa best. Nak cerita lebih lanjut? 😔",
    "Saya faham, kadang-kadang memang rasa macam tu. Apa yang jadi?",
    "Aduh, tak seronok tu. Saya ada kat sini kalau awak nak luahkan."
  ],
  veryNeg: [
    "Saya dengar awak betul-betul tak okay sekarang. 😢 Ambil nafas sekejap, saya ada sini.",
    "Maaf awak kena lalui benda tu. Itu memang berat. Nak cerita apa yang jadi?",
    "Rasa macam tu memang tak mudah. Awak tak keseorangan, luahkan je dengan saya."
  ]
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];

/* ---------- Intent rules ---------- */
const INTENTS = [
  [/^(hai|hi|hello|helo|hey|salam|assalamualaikum|yo)\b/, "greeting"],
  [/(apa khabar|how are you|awak sihat|kamu sihat)/, "how"],
  [/(siapa (kamu|awak|nama)|who are you|nama (kamu|awak))/, "name"],
  [/(terima kasih|thank|thanks|tq|tqvm)/, "thanks"],
  [/(^bye\b|jumpa lagi|selamat tinggal|goodbye|see you)/, "bye"]
];

/* ---------- Small Malay lexicon (the model only knows English) ---------- */
const NEG_WORDS = ["sedih","marah","penat","bosan","benci","teruk","stress","stres","geram","kecewa","susah","sakit","takut","risau","buruk","menyampah","letih","tertekan","putus asa","down","sunyi","kena marah","fed up","burnout"];
const POS_WORDS = ["gembira","seronok","bahagia","best","bagus","syukur","suka","sayang","hebat","cantik","mantap","lega","teruja","happy","excited","naik pangkat","lulus","berjaya"];

function lexiconSentiment(text) {
  const t = text.toLowerCase();
  const neg = NEG_WORDS.filter(w => t.includes(w)).length;
  const pos = POS_WORDS.filter(w => t.includes(w)).length;
  if (neg === 0 && pos === 0) return null;
  if (neg > pos) return { label: "NEGATIVE", score: Math.min(0.97, 0.88 + neg * 0.03) };
  if (pos > neg) return { label: "POSITIVE", score: Math.min(0.97, 0.88 + pos * 0.03) };
  return { label: "POSITIVE", score: 0.5 };
}

async function sentimentOf(text) {
  const lex = lexiconSentiment(text);
  if (lex) return lex;
  const out = await classifier(text, { top_k: 1 });
  return out[0];
}

function bucket(s) {
  const pos = s.label === "POSITIVE";
  const c = s.score;
  if (c < 0.65) return "neutral";
  if (pos) return c > 0.95 ? "veryPos" : "pos";
  return c > 0.95 ? "veryNeg" : "neg";
}

const EMOJI = { veryPos: "😄", pos: "🙂", neutral: "😐", neg: "🙁", veryNeg: "😢" };
const LABEL = { veryPos: "Sangat positif", pos: "Positif", neutral: "Neutral", neg: "Negatif", veryNeg: "Sangat negatif" };

/* ---------- UI helpers ---------- */
function addMsg(who, text, tag) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.appendChild(b);
  if (tag) {
    const t = document.createElement("div");
    t.className = "tag";
    t.textContent = tag;
    wrap.appendChild(t);
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function updateMood(s) {
  const v = s.label === "POSITIVE" ? s.score : 1 - s.score; // 0..1 positivity
  moodScores.push(v);
  const recent = moodScores.slice(-5);
  const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
  moodFill.style.width = (avg * 100).toFixed(0) + "%";
}

async function send(text) {
  text = text.trim();
  if (!text || busy || !classifier) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = "";

  const userMsg = addMsg("user", text);
  const typing = addMsg("bot typing", "•••");

  let key, tag, reply;
  const t = text.toLowerCase();
  const intent = INTENTS.find(([re]) => re.test(t));

  try {
    const s = await sentimentOf(text);
    key = bucket(s);
    tag = `${EMOJI[key]} ${LABEL[key]} · ${(s.score * 100).toFixed(0)}%`;
    updateMood(s);
    reply = pick(R[intent ? intent[1] : key]);
  } catch (e) {
    reply = "Alamak, saya tersangkut sekejap. Cuba hantar semula?";
  }

  await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
  typing.remove();
  if (tag) {
    const tg = document.createElement("div");
    tg.className = "tag";
    tg.textContent = tag;
    userMsg.appendChild(tg);
  }
  addMsg("bot", reply);

  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", () => send(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });
document.querySelectorAll(".chip").forEach(c =>
  c.addEventListener("click", () => send(c.dataset.t))
);

/* ---------- Load model ---------- */
addMsg("bot", "Hai, saya Pulse. 👋 Saya baca perasaan di sebalik mesej awak dan balas ikut mood. Cuba tulis sesuatu!");

try {
  classifier = await pipeline(
    "sentiment-analysis",
    "Xenova/distilbert-base-uncased-finetuned-sst-2-english",
    {
      progress_callback: (p) => {
        if (p.status === "progress" && typeof p.progress === "number") {
          statusEl.textContent = `Memuat turun model... ${p.progress.toFixed(0)}%`;
        }
      }
    }
  );
  statusEl.textContent = "🟢 Sedia";
  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
} catch (err) {
  statusEl.textContent = "Model gagal dimuatkan";
  addMsg("bot", "Maaf, model AI gagal dimuatkan: " + err.message);
}
</script>
</body>
</html>
